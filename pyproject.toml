[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-starter"
version = "1.0.0"
description = "A documented, testable Hello World command-line starter project."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Repository Maintainer" }
]
dependencies = []

[project.scripts]
hello-world = "hello_world:main"

[tool.setuptools]
py-modules = ["hello_world"]
